# Milestone A (temporary, see docs/PROGRESS.md): plain MQTT, reachable only inside the
# Docker network (the port is not published to the laptop or the LAN), anonymous clients.
# Milestone B adds per-device passwords and topic ACLs; Milestone C adds TLS on 8883.
listener 1883 0.0.0.0
allow_anonymous true

# Audio clips travel as base64 JSON: allow up to ~2 MB per packet, reject anything larger.
max_packet_size 2000000

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
